# Nginx: فایل‌های استاتیک فرانت‌اند + پروکسی /api به API (و مسیر health)
# ویندوز: nginx.conf → include این فایل در بلوک http ؛ لینوکس: /etc/nginx/conf.d/pos-support.conf
# مسیر root را به خروجی build (apps/web/dist) تغییر دهید. برای HTTPS فایل‌های گواهی را تنظیم کنید.

upstream pos_api {
    server 127.0.0.1:3000;
    # scale افقی: چند پروسه‌ی API روی پورت‌های دیگر (API_PORT=3001 ...) و خطوط server بیشتر
    # server 127.0.0.1:3001;
    keepalive 32;
}

# درخواست‌های ورود: محدودیت اضافه در لایه‌ی Nginx (علاوه بر rate limit برنامه)
limit_req_zone $binary_remote_addr zone=pos_login:10m rate=20r/m;

server {
    listen 80;
    server_name pos.example.local;
    # HTTPS را فعال کنید و این بلوک را به redirect تبدیل کنید:
    # return 301 https://$host$request_uri;

    root /opt/pos/apps/web/dist;       # ویندوز: C:/pos/apps/web/dist
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # آپلود فایل‌های بزرگ (باید ≥ UPLOAD_MAX_MB در .env باشد) و بدون بافر کردن کل بدنه در دیسک
    client_max_body_size 110m;
    client_body_timeout 300s;
    proxy_request_buffering off;

    location /api/v1/auth/login {
        limit_req zone=pos_login burst=10 nodelay;
        proxy_pass http://pos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://pos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;           # خروجی‌ها/گزارش‌های سنگین
        proxy_send_timeout 300s;
    }

    location = /health { proxy_pass http://pos_api; }
    location = /health/ready { proxy_pass http://pos_api; allow 127.0.0.1; deny all; }

    # فایل‌های هش‌دار Vite: کش طولانی؛ index.html هرگز کش نشود
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;        # SPA fallback
    }
}
